# .cargo/config.toml

[target.wasm32-unknown-unknown]
rustflags = [
    "-C", "target-feature=+atomics,+bulk-memory,+mutable-globals,+simd128"
]

# ── Android NDK cross-compilation ──────────────────────────────
# Requires: Android NDK r23+, rustup target add <target>, cargo-ndk
# NDK toolchain must be on PATH ($ANDROID_NDK_HOME/toolchains/llvm/prebuilt/<os>-x86_64/bin/)

[target.aarch64-linux-android]
linker = "aarch64-linux-android21-clang"

[target.armv7-linux-androideabi]
linker = "armv7a-linux-androideabi21-clang"

[target.x86_64-linux-android]
linker = "x86_64-linux-android21-clang"

[target.i686-linux-android]
linker = "i686-linux-android21-clang"